<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendix — Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Apply saved theme before paint to avoid flash -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem("theme") || "light";
            if (savedTheme === "dark") document.documentElement.classList.add("dark-theme-variables");
            document.documentElement.setAttribute("data-theme", savedTheme);
        })();
    </script>

    <style>
        /* ---- Variables (mirrors admin.css) ---- */
        :root {
            --color-primary: #7380ec;
            --color-danger: #ff7782;
            --color-success: #41f1b6;
            --color-white: #fff;
            --color-info-dark: #7d8da1;
            --color-dark: #363949;
            --color-light: rgba(132, 139, 200, 0.18);
            --color-dark-variant: #677483;
            --color-background: #f6f6f9;
            --border-radius-1: 0.4rem;
            --border-radius-2: 0.8rem;
            --card-border-radius: 2rem;
            --box-shadow: 0 2rem 3rem var(--color-light);
        }

        .dark-theme-variables {
            --color-background: #181a1e;
            --color-white: #202528;
            --color-dark: #edeffd;
            --color-dark-variant: #a3bdcc;
            --color-light: rgba(0, 0, 0, 0.4);
        }

        * { margin:0; padding:0; box-sizing:border-box; outline:0; border:0; text-decoration:none; list-style:none; }
        * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }

        html { font-size: 14px; }

        body {
            font-family: Poppins, sans-serif;
            background: var(--color-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative blobs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px; height: 500px;
            background: var(--color-primary);
            top: -120px; left: -120px;
        }
        body::after {
            width: 400px; height: 400px;
            background: var(--color-danger);
            bottom: -100px; right: -100px;
        }

        /* Theme toggler (top-right) */
        .theme-toggle {
            position: fixed;
            top: 1.2rem;
            right: 1.4rem;
            background: var(--color-light);
            display: flex;
            align-items: center;
            height: 1.6rem;
            width: 4.2rem;
            cursor: pointer;
            border-radius: var(--border-radius-1);
            z-index: 10;
        }
        .theme-toggle span {
            font-size: 1.1rem;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-dark);
        }
        .theme-toggle span.active {
            background: var(--color-primary);
            color: #fff;
            border-radius: var(--border-radius-1);
        }

        /* Login card */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-card {
            background: var(--color-white);
            border-radius: var(--card-border-radius);
            padding: 2.8rem 2.4rem;
            box-shadow: var(--box-shadow);
            animation: slideUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 2rem;
        }
        .login-logo img {
            width: 2.6rem;
            height: 2.6rem;
            display: block;
        }
        .login-logo h2 {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 1px;
            color: var(--color-dark);
        }
        .login-logo h2 span { color: var(--color-danger); }

        .login-heading {
            margin-bottom: 0.3rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--color-dark);
        }
        .login-sub {
            font-size: 0.82rem;
            color: var(--color-info-dark);
            margin-bottom: 2rem;
        }

        /* Error flash */
        .flash-error {
            background: rgba(255, 119, 130, 0.12);
            border: 1.5px solid var(--color-danger);
            color: var(--color-danger);
            border-radius: var(--border-radius-2);
            padding: 0.65rem 1rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.4rem;
        }

        /* Form groups */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-bottom: 1.2rem;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-dark);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .form-label-icon {
            font-size: 1rem !important;
            color: var(--color-primary);
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 0.7rem 0.9rem 0.7rem 2.5rem;
            border-radius: var(--border-radius-2);
            border: 1.5px solid var(--color-light);
            background: var(--color-background);
            color: var(--color-dark);
            font-family: Poppins, sans-serif;
            font-size: 0.83rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(115,128,236,0.12);
        }

        .input-icon {
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem !important;
            color: var(--color-info-dark);
            pointer-events: none;
        }

        /* Show/hide password toggle */
        .toggle-pw {
            position: absolute;
            right: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.1rem !important;
            color: var(--color-info-dark);
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: var(--color-primary); }

        /* Submit button */
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            border-radius: var(--border-radius-2);
            background: var(--color-primary);
            color: #fff;
            font-family: Poppins, sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
            transition: opacity 0.2s, transform 0.15s;
            letter-spacing: 0.3px;
        }
        .btn-login:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        .login-footer {
            margin-top: 1.8rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--color-info-dark);
        }
    </style>
</head>
<body>

    <!-- Theme toggle -->
    <div class="theme-toggle" id="themeToggler">
        <span class="material-icons-sharp" id="lightIcon">light_mode</span>
        <span class="material-icons-sharp" id="darkIcon">dark_mode</span>
    </div>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Attendix">
                <h2>ATTEN<span>DIX</span></h2>
            </div>

            <h2 class="login-heading">Welcome back 👋</h2>
            <p class="login-sub">Sign in to your admin account to continue.</p>

            <!-- Error message (show if login failed) -->
            {% if error %}
            <div class="flash-error">
                <span class="material-icons-sharp" style="font-size:1rem;">error_outline</span>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/admin/login">

                <div class="form-group">
                    <label for="email">
                        <span class="material-icons-sharp form-label-icon">mail_outline</span>
                        Email Address
                    </label>
                    <div class="input-wrapper">
                        <span class="material-icons-sharp input-icon">alternate_email</span>
                        <input type="email" id="email" name="email" placeholder="admin@company.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <span class="material-icons-sharp form-label-icon">lock_outline</span>
                        Password
                    </label>
                    <div class="input-wrapper">
                        <span class="material-icons-sharp input-icon">lock_outline</span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <span class="material-icons-sharp toggle-pw" id="togglePw">visibility</span>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span class="material-icons-sharp" style="font-size:1rem;">login</span>
                    Sign In
                </button>

            </form>

            <div class="login-footer">
                &copy; {{ 2025 }} Attendix — Smart Attendance System
            </div>

        </div>
    </div>

    <script>
        // ---- Theme toggler ----
        const toggler = document.getElementById('themeToggler');
        const lightIcon = document.getElementById('lightIcon');
        const darkIcon = document.getElementById('darkIcon');

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-theme-variables');
                darkIcon.classList.add('active');
                lightIcon.classList.remove('active');
            } else {
                document.documentElement.classList.remove('dark-theme-variables');
                lightIcon.classList.add('active');
                darkIcon.classList.remove('active');
            }
            localStorage.setItem('theme', theme);
        }

        const saved = localStorage.getItem('theme') || 'light';
        applyTheme(saved);

        toggler.addEventListener('click', () => {
            const current = localStorage.getItem('theme') || 'light';
            applyTheme(current === 'dark' ? 'light' : 'dark');
        });

        // ---- Password visibility toggle ----
        const togglePw = document.getElementById('togglePw');
        const pwInput = document.getElementById('password');
        togglePw.addEventListener('click', () => {
            const isText = pwInput.type === 'text';
            pwInput.type = isText ? 'password' : 'text';
            togglePw.textContent = isText ? 'visibility' : 'visibility_off';
        });
    </script>

</body>
</html>
